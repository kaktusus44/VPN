---
- name: Deploy VPN core
  hosts: vpn_servers
  gather_facts: true
  become: true
  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/vpn_servers.yml
  roles:
    - base
    - firewall
    - fail2ban
    - amneziawg
    - unbound_dns
    - xray_reality
    - mtproto_proxy
    - socks5_proxy
    - telegram_proxy_export
    - vpn_clients
