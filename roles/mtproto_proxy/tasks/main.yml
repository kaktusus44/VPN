---
- name: Enable Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
  when: install_mtproto | bool

- name: Generate MTProto secret once
  ansible.builtin.shell: umask 077 && openssl rand -hex 16 > /var/lib/vpn/mtproto-secret
  args:
    creates: /var/lib/vpn/mtproto-secret
  when: install_mtproto | bool
  no_log: true

- name: Read MTProto secret
  ansible.builtin.slurp:
    src: /var/lib/vpn/mtproto-secret
  register: mtproto_secret_raw
  when: install_mtproto | bool
  no_log: true

- name: Store MTProto secret for export
  ansible.builtin.set_fact:
    mtproto_secret: "{{ mtproto_secret_raw.content | b64decode | trim }}"
  when: install_mtproto | bool
  no_log: true

- name: Inspect existing MTProto proxy container
  ansible.builtin.command: docker inspect mtproto-proxy
  when: install_mtproto | bool
  register: mtproto_container
  changed_when: false
  failed_when: false
  no_log: true

- name: Decide whether MTProto settings changed
  ansible.builtin.set_fact:
    mtproto_recreate: "{{ mtproto_container.rc != 0 or ('SECRET=' ~ mtproto_secret) not in ((mtproto_container.stdout | from_json)[0].Config.Env | default([])) or (mtproto_container.stdout | from_json)[0].HostConfig.PortBindings['443/tcp'][0].HostPort != mtproto_port | string }}"
  when: install_mtproto | bool
  no_log: true

- name: Replace MTProto proxy container only when settings changed
  ansible.builtin.command: docker rm -f mtproto-proxy
  when:
    - install_mtproto | bool
    - mtproto_recreate | bool
    - mtproto_container.rc == 0

- name: Run MTProto proxy container
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --detach
      - --name
      - mtproto-proxy
      - --restart
      - always
      - --publish
      - "{{ mtproto_port }}:443"
      - --env
      - "SECRET={{ mtproto_secret }}"
      - --env
      - WORKERS=2
      - telegrammessenger/proxy:latest
  when:
    - install_mtproto | bool
    - mtproto_recreate | bool
  no_log: true

- name: Ensure unchanged MTProto proxy is running
  ansible.builtin.command: docker start mtproto-proxy
  when:
    - install_mtproto | bool
    - not (mtproto_recreate | bool)
    - not ((mtproto_container.stdout | from_json)[0].State.Running | bool)

- name: Remove MTProto proxy when disabled
  ansible.builtin.shell: command -v docker >/dev/null 2>&1 && docker rm -f mtproto-proxy || true
  when: not (install_mtproto | bool)
  changed_when: false
