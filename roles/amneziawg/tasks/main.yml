---
- name: Install WireGuard-compatible packages
  ansible.builtin.apt:
    name:
      - wireguard-tools
      - iptables
    state: present
    update_cache: true

- name: Install WireGuard kernel modules package when available
  ansible.builtin.apt:
    name: "linux-modules-extra-{{ ansible_kernel }}"
    state: present
  failed_when: false

- name: Load WireGuard kernel module
  ansible.builtin.command: modprobe wireguard
  changed_when: false
  failed_when: false

- name: Create VPN state directory
  ansible.builtin.file:
    path: /var/lib/vpn
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Create WireGuard config directory
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Generate server private key
  ansible.builtin.shell: "wg genkey > /var/lib/vpn/{{ awg_interface }}.server.key"
  args:
    creates: "/var/lib/vpn/{{ awg_interface }}.server.key"

- name: Secure server private key
  ansible.builtin.file:
    path: "/var/lib/vpn/{{ awg_interface }}.server.key"
    owner: root
    group: root
    mode: "0600"

- name: Read server private key
  ansible.builtin.slurp:
    src: "/var/lib/vpn/{{ awg_interface }}.server.key"
  register: awg_server_private_key_raw
  no_log: true

- name: Derive server public key
  ansible.builtin.command: "wg pubkey"
  args:
    stdin: "{{ awg_server_private_key_raw.content | b64decode }}"
  register: awg_server_public_key
  changed_when: false
  no_log: true

- name: Generate first client private key
  ansible.builtin.shell: "wg genkey > /var/lib/vpn/client-001.key"
  args:
    creates: /var/lib/vpn/client-001.key

- name: Secure first client private key
  ansible.builtin.file:
    path: /var/lib/vpn/client-001.key
    owner: root
    group: root
    mode: "0600"

- name: Read first client private key
  ansible.builtin.slurp:
    src: /var/lib/vpn/client-001.key
  register: awg_client_private_key_raw
  no_log: true

- name: Derive first client public key
  ansible.builtin.command: "wg pubkey"
  args:
    stdin: "{{ awg_client_private_key_raw.content | b64decode }}"
  register: awg_client_public_key
  changed_when: false
  no_log: true

- name: Render server interface config
  ansible.builtin.template:
    src: awg0.conf.j2
    dest: "/etc/wireguard/{{ awg_interface }}.conf"
    owner: root
    group: root
    mode: "0600"
  notify: Restart awg interface

- name: Enable server interface
  block:
    - name: Start wg-quick interface
      ansible.builtin.systemd:
        name: "wg-quick@{{ awg_interface }}"
        enabled: true
        state: started
  rescue:
    - name: Collect wg-quick service status
      ansible.builtin.command: "systemctl status --no-pager -l wg-quick@{{ awg_interface }}"
      register: awg_service_status
      changed_when: false
      failed_when: false

    - name: Collect wg-quick journal
      ansible.builtin.command: "journalctl -u wg-quick@{{ awg_interface }} -n 80 --no-pager"
      register: awg_service_journal
      changed_when: false
      failed_when: false

    - name: Collect sanitized WireGuard config
      ansible.builtin.shell: "sed -E 's/^(PrivateKey = ).*/\\1<hidden>/' /etc/wireguard/{{ awg_interface }}.conf"
      register: awg_sanitized_config
      changed_when: false
      failed_when: false

    - name: Show wg-quick startup diagnostics
      ansible.builtin.debug:
        msg:
          service_status: "{{ awg_service_status.stdout_lines }}"
          service_journal: "{{ awg_service_journal.stdout_lines }}"
          sanitized_config: "{{ awg_sanitized_config.stdout_lines }}"

    - name: Fail after wg-quick diagnostics
      ansible.builtin.fail:
        msg: "wg-quick@{{ awg_interface }} failed to start; diagnostics printed above."
