---
- name: Install monitoring agent dependencies
  ansible.builtin.apt:
    name:
      - python3
      - python3-prometheus-client
      - curl
      - gzip
      - prometheus-node-exporter
    state: present
    update_cache: true

- name: Enable node exporter service
  ansible.builtin.systemd:
    name: prometheus-node-exporter
    enabled: true
    state: started

- name: Create custom exporter group
  ansible.builtin.group:
    name: "{{ vpn_custom_exporter_group }}"
    system: true
  when: vpn_custom_exporter_group != "root"

- name: Create custom exporter user
  ansible.builtin.user:
    name: "{{ vpn_custom_exporter_user }}"
    group: "{{ vpn_custom_exporter_group }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin
  when: vpn_custom_exporter_user != "root"

- name: Create custom exporter state directory
  ansible.builtin.file:
    path: "{{ vpn_custom_exporter_state_dir }}"
    state: directory
    owner: "{{ vpn_custom_exporter_user }}"
    group: "{{ vpn_custom_exporter_group }}"
    mode: "0750"

- name: Create ASN table state directory
  ansible.builtin.file:
    path: "{{ vpn_custom_exporter_asn_state_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install ASN table updater
  ansible.builtin.template:
    src: vpn-asn-update.j2
    dest: /usr/local/bin/vpn-asn-update
    owner: root
    group: root
    mode: "0755"

- name: Install ASN table updater service
  ansible.builtin.template:
    src: vpn-asn-update.service.j2
    dest: /etc/systemd/system/vpn-asn-update.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Install ASN table updater timer
  ansible.builtin.template:
    src: vpn-asn-update.timer.j2
    dest: /etc/systemd/system/vpn-asn-update.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Enable ASN table updater timer
  ansible.builtin.systemd:
    name: vpn-asn-update.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Download initial ASN table when missing
  ansible.builtin.command: /usr/local/bin/vpn-asn-update
  args:
    creates: "{{ vpn_custom_exporter_asn_table_path }}"

- name: Install VPN custom exporter
  ansible.builtin.template:
    src: vpn-custom-exporter.py.j2
    dest: "{{ vpn_custom_exporter_path }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart vpn-custom-exporter

- name: Install VPN custom exporter service
  ansible.builtin.template:
    src: vpn-custom-exporter.service.j2
    dest: /etc/systemd/system/vpn-custom-exporter.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart vpn-custom-exporter

- name: Enable VPN custom exporter service
  ansible.builtin.systemd:
    name: vpn-custom-exporter
    enabled: true
    state: started
    daemon_reload: true

- name: Allow main Prometheus to scrape node exporter on reserve
  community.general.ufw:
    rule: allow
    from_ip: "{{ hostvars[item].vpn_public_endpoint | default(hostvars[item].ansible_host) }}"
    port: "9100"
    proto: tcp
  loop: "{{ groups['vpn_servers'] | default([]) }}"
  when:
    - vpn_server_role != "main"
    - hostvars[item].vpn_server_role | default("") == "main"

- name: Allow main Prometheus to scrape VPN exporter on reserve
  community.general.ufw:
    rule: allow
    from_ip: "{{ hostvars[item].vpn_public_endpoint | default(hostvars[item].ansible_host) }}"
    port: "{{ vpn_custom_exporter_port }}"
    proto: tcp
  loop: "{{ groups['vpn_servers'] | default([]) }}"
  when:
    - vpn_server_role != "main"
    - hostvars[item].vpn_server_role | default("") == "main"
