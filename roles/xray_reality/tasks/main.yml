---
- name: Install Xray installer dependencies
  ansible.builtin.apt:
    name:
      - curl
      - unzip
      - ca-certificates
      - openssl
    state: present
    update_cache: true

- name: Install Xray core with official installer
  ansible.builtin.shell: >
    bash -c "$(curl -L https://github.com/XTLS/Xray-install/raw/main/install-release.sh)"
    @ install --version {{ xray_version }}
  args:
    creates: /usr/local/bin/xray

- name: Create VPN state directory
  ansible.builtin.file:
    path: /var/lib/vpn
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Generate Xray client UUID
  ansible.builtin.shell: "/usr/local/bin/xray uuid > /var/lib/vpn/client-001.xray.uuid"
  args:
    creates: /var/lib/vpn/client-001.xray.uuid

- name: Generate Reality keypair
  ansible.builtin.shell: "/usr/local/bin/xray x25519 > /var/lib/vpn/xray-reality.keys"
  args:
    creates: /var/lib/vpn/xray-reality.keys

- name: Generate Reality short ID
  ansible.builtin.shell: "openssl rand -hex 8 > /var/lib/vpn/xray-reality.shortid"
  args:
    creates: /var/lib/vpn/xray-reality.shortid

- name: Read Xray client UUID
  ansible.builtin.slurp:
    src: /var/lib/vpn/client-001.xray.uuid
  register: xray_client_uuid_raw
  no_log: true

- name: Read Reality keypair
  ansible.builtin.slurp:
    src: /var/lib/vpn/xray-reality.keys
  register: xray_reality_keys_raw
  no_log: true

- name: Read Reality short ID
  ansible.builtin.slurp:
    src: /var/lib/vpn/xray-reality.shortid
  register: xray_reality_short_id_raw
  no_log: true

- name: Decode Reality keypair output
  ansible.builtin.set_fact:
    xray_reality_key_lines: "{{ (xray_reality_keys_raw.content | b64decode).splitlines() }}"
  no_log: true

- name: Parse Reality keypair
  ansible.builtin.set_fact:
    xray_reality_private_key: "{{ (xray_reality_key_lines | select('search', '(?i)^private[ \\t]*key[ \\t]*:') | list | first | default('')) | regex_replace('(?i)^private[ \\t]*key[ \\t]*:[ \\t]*', '') }}"
    xray_reality_public_key: "{{ (xray_reality_key_lines | select('search', '(?i)^public[ \\t]*key[ \\t]*:') | list | first | default(xray_reality_key_lines | select('search', '(?i)^password[ \\t]*:') | list | first | default(''))) | regex_replace('(?i)^(public[ \\t]*key|password)[ \\t]*:[ \\t]*', '') }}"
    xray_client_uuid: "{{ xray_client_uuid_raw.content | b64decode | trim }}"
    xray_reality_short_id: "{{ xray_reality_short_id_raw.content | b64decode | trim }}"
  no_log: true

- name: Derive missing Reality public key
  ansible.builtin.command:
    argv:
      - /usr/local/bin/xray
      - x25519
      - -i
      - "{{ xray_reality_private_key }}"
  register: xray_reality_derived_keypair
  changed_when: false
  when:
    - xray_reality_private_key | length > 0
    - xray_reality_public_key | length == 0
  no_log: true

- name: Decode derived Reality keypair output
  ansible.builtin.set_fact:
    xray_reality_derived_key_lines: "{{ (xray_reality_derived_keypair.stdout_lines | default([])) + (xray_reality_derived_keypair.stderr_lines | default([])) }}"
  when:
    - xray_reality_public_key | length == 0
    - xray_reality_derived_keypair is defined
    - not xray_reality_derived_keypair.skipped | default(false)
  no_log: true

- name: Parse derived Reality public key
  ansible.builtin.set_fact:
    xray_reality_public_key: "{{ (xray_reality_derived_key_lines | default([]) | select('search', '(?i)^public[ \\t]*key[ \\t]*:') | list | first | default(xray_reality_derived_key_lines | default([]) | select('search', '(?i)^password[ \\t]*:') | list | first | default(''))) | regex_replace('(?i)^(public[ \\t]*key|password)[ \\t]*:[ \\t]*', '') }}"
  when:
    - xray_reality_public_key | length == 0
    - xray_reality_derived_key_lines | default([]) | length > 0
  no_log: true

- name: Normalize repaired Reality keypair file
  ansible.builtin.copy:
    content: "{{ xray_reality_derived_key_lines | join('\n') }}\n"
    dest: /var/lib/vpn/xray-reality.keys
    owner: root
    group: root
    mode: "0600"
  when:
    - xray_reality_public_key | length > 0
    - xray_reality_derived_key_lines | default([]) | length > 0
  no_log: true

- name: Validate Reality keypair was parsed
  ansible.builtin.assert:
    that:
      - xray_reality_private_key | length > 0
      - xray_reality_public_key | length > 0
    fail_msg: "Could not parse Xray Reality keypair output from /usr/local/bin/xray x25519."

- name: Render Xray config
  ansible.builtin.template:
    src: config.json.j2
    dest: /usr/local/etc/xray/config.json
    owner: root
    group: root
    mode: "0600"
  notify: Restart xray

- name: Validate Xray config
  ansible.builtin.command: /usr/local/bin/xray run -test -config /usr/local/etc/xray/config.json
  changed_when: false

- name: Enable Xray
  ansible.builtin.systemd:
    name: xray
    enabled: true
    state: started
