---
- name: Render VPN-only Unbound config
  ansible.builtin.template:
    src: vpn.conf.j2
    dest: /etc/unbound/unbound.conf.d/vpn.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/unbound-checkconf %s
  notify: Restart unbound

- name: Enable Unbound
  ansible.builtin.systemd:
    name: unbound
    enabled: true
    state: started
