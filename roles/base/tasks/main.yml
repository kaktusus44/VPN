---
- name: Keep an existing Docker installation when enabling MTProto
  ansible.builtin.command: docker --version
  register: vpn_docker_check
  changed_when: false
  failed_when: false
  when: install_mtproto | bool

- name: Install base packages
  vars:
    vpn_core_packages:
      - ca-certificates
      - curl
      - gnupg
      - jq
      - ufw
      - fail2ban
      - unattended-upgrades
      - vim
      - unzip
      - openssl
      - unbound
      - iproute2
      - iptables
      - python3
      - python3-yaml
      - software-properties-common
  ansible.builtin.apt:
    name: "{{ vpn_core_packages + (['docker.io'] if install_mtproto | bool and vpn_docker_check.rc != 0 else []) + (['dante-server'] if install_socks5 | bool else []) }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 1200

- name: Enable unattended upgrades
  ansible.builtin.systemd:
    name: unattended-upgrades
    enabled: true
    state: started

- name: Enable IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: true
    state: present
    reload: true

- name: Enable IPv6 forwarding
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: "1"
    sysctl_set: true
    state: present
    reload: true
  when: vpn_enable_ipv6 | bool
