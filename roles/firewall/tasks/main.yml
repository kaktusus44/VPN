---
- name: Allow SSH before tightening default UFW policies
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
    port: "{{ ansible_port | default(22) }}"
    proto: tcp
  loop: "{{ vpn_allowed_ssh_sources | default(['0.0.0.0/0']) }}"

- name: Reset default UFW policies
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }
    - { direction: routed, policy: deny }

- name: Allow configured public TCP ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ vpn_public_tcp_ports }}"

- name: Allow configured public UDP ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: udp
  loop: "{{ vpn_public_udp_ports }}"

- name: Deny forbidden public ports
  community.general.ufw:
    rule: deny
    port: "{{ item }}"
    proto: tcp
  loop: "{{ vpn_forbidden_public_ports }}"

- name: Allow VPN clients to route IPv4 traffic through the server
  community.general.ufw:
    rule: allow
    route: true
    interface_in: "{{ awg_interface }}"
    interface_out: "{{ ansible_default_ipv4.interface }}"
    from_ip: "{{ awg_ipv4_network }}"
    to_ip: any

- name: Allow VPN clients to route IPv6 traffic through the server
  community.general.ufw:
    rule: allow
    route: true
    interface_in: "{{ awg_interface }}"
    interface_out: "{{ ansible_default_ipv6.interface }}"
    from_ip: "{{ awg_ipv6_network }}"
    to_ip: any
  when:
    - vpn_enable_ipv6 | bool
    - ansible_default_ipv6.interface is defined
    - ansible_default_ipv6.interface | length > 0

- name: Enable UFW
  community.general.ufw:
    state: enabled
