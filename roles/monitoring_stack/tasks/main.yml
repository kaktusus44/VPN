---
- name: Install monitoring stack dependencies
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - gnupg
      - nginx
      - apache2-utils
      - openssl
      - software-properties-common
      - wget
      - prometheus
      - prometheus-alertmanager
      - adduser
      - libfontconfig1
      - musl
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 1200

- name: Check manually installed Grafana apt key
  ansible.builtin.stat:
    path: /etc/apt/trusted.gpg.d/grafana.asc
  register: grafana_trusted_key
  when: monitoring_grafana_deb_path | length == 0

- name: Add Grafana apt key when missing
  ansible.builtin.apt_key:
    url: https://apt.grafana.com/gpg.key
    state: present
  when:
    - monitoring_grafana_deb_path | length == 0
    - not grafana_trusted_key.stat.exists

- name: Add Grafana apt repository
  ansible.builtin.apt_repository:
    repo: deb https://apt.grafana.com stable main
    state: present
    filename: grafana
  when: monitoring_grafana_deb_path | length == 0

- name: Install Grafana
  ansible.builtin.apt:
    name: grafana
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 1200
  when: monitoring_grafana_deb_path | length == 0

- name: Copy Grafana deb package from control machine
  ansible.builtin.copy:
    src: "{{ monitoring_grafana_deb_path }}"
    dest: /tmp/grafana.deb
    owner: root
    group: root
    mode: "0644"
  when: monitoring_grafana_deb_path | length > 0

- name: Install Grafana from deb package
  ansible.builtin.apt:
    deb: /tmp/grafana.deb
    state: present
    lock_timeout: 1200
  when: monitoring_grafana_deb_path | length > 0

- name: Create Prometheus rules directory
  ansible.builtin.file:
    path: /etc/prometheus/rules
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create Alertmanager templates directory
  ansible.builtin.file:
    path: /etc/prometheus/alertmanager-templates
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Alertmanager Telegram message template
  ansible.builtin.template:
    src: alertmanager-telegram.tmpl.j2
    dest: /etc/prometheus/alertmanager-templates/telegram.tmpl
    owner: root
    group: root
    mode: "0644"
  notify: Restart alertmanager

- name: Configure Prometheus
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: root
    group: root
    mode: "0644"
  notify: Restart prometheus

- name: Configure Prometheus service defaults
  ansible.builtin.template:
    src: prometheus.default.j2
    dest: /etc/default/prometheus
    owner: root
    group: root
    mode: "0644"
  notify: Restart prometheus

- name: Configure Alertmanager
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: /etc/prometheus/alertmanager.yml
    owner: root
    group: prometheus
    mode: "0640"
  no_log: "{{ monitoring_alertmanager_telegram_enabled | bool }}"
  notify: Restart alertmanager

- name: Configure Alertmanager service defaults
  ansible.builtin.template:
    src: prometheus-alertmanager.default.j2
    dest: /etc/default/prometheus-alertmanager
    owner: root
    group: root
    mode: "0644"
  notify: Restart alertmanager

- name: Configure Grafana
  ansible.builtin.template:
    src: grafana.ini.j2
    dest: /etc/grafana/grafana.ini
    owner: root
    group: grafana
    mode: "0640"
  no_log: "{{ monitoring_grafana_admin_password | length > 0 }}"
  notify: Restart grafana

- name: Create Grafana TLS directory
  ansible.builtin.file:
    path: "{{ monitoring_grafana_tls_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  when: >
    (monitoring_grafana_external_enabled | bool)
    or (monitoring_alertmanager_external_enabled | bool)
    or (monitoring_prometheus_external_enabled | bool)

- name: Generate self-signed Grafana TLS certificate
  ansible.builtin.command: >
    openssl req -x509 -nodes -newkey rsa:2048 -days 825
    -keyout {{ monitoring_grafana_tls_dir }}/grafana.key
    -out {{ monitoring_grafana_tls_dir }}/grafana.crt
    -subj /CN={{ monitoring_grafana_external_server_name }}
  args:
    creates: "{{ monitoring_grafana_tls_dir }}/grafana.crt"
  when: >
    (monitoring_grafana_external_enabled | bool)
    or (monitoring_alertmanager_external_enabled | bool)
    or (monitoring_prometheus_external_enabled | bool)
  notify: Restart nginx

- name: Secure Grafana TLS private key
  ansible.builtin.file:
    path: "{{ monitoring_grafana_tls_dir }}/grafana.key"
    owner: root
    group: root
    mode: "0600"
  when: >
    (monitoring_grafana_external_enabled | bool)
    or (monitoring_alertmanager_external_enabled | bool)
    or (monitoring_prometheus_external_enabled | bool)

- name: Ensure Grafana password file exists
  ansible.builtin.copy:
    dest: "{{ monitoring_grafana_htpasswd_path }}"
    content: ""
    force: false
    owner: root
    group: www-data
    mode: "0640"
  when: monitoring_grafana_external_enabled | bool

- name: Install Grafana Basic Auth password file idempotently
  ansible.builtin.shell: |
    if [ "$VPN_AUTH_PRESERVE" = true ] && [ -s {{ monitoring_grafana_htpasswd_path }} ]; then
      echo unchanged
    elif printf '%s\n' "$VPN_AUTH_PASSWORD" | htpasswd -viB {{ monitoring_grafana_htpasswd_path }} {{ monitoring_grafana_basic_auth_user }} >/dev/null 2>&1; then
      echo unchanged
    else
      printf '%s\n' "$VPN_AUTH_PASSWORD" | htpasswd -iB {{ monitoring_grafana_htpasswd_path }} {{ monitoring_grafana_basic_auth_user }}
      echo changed
    fi
  environment:
    VPN_AUTH_PASSWORD: "{{ monitoring_grafana_basic_auth_password }}"
    VPN_AUTH_PRESERVE: "{{ monitoring_preserve_grafana_auth | default(true) | bool | ternary('true', 'false') }}"
  register: monitoring_grafana_auth_result
  changed_when: "'changed' in monitoring_grafana_auth_result.stdout_lines"
  no_log: true
  when: monitoring_grafana_external_enabled | bool
  notify: Restart nginx

- name: Configure Grafana nginx reverse proxy
  ansible.builtin.template:
    src: nginx-grafana.conf.j2
    dest: /etc/nginx/sites-available/grafana.conf
    owner: root
    group: root
    mode: "0644"
  when: monitoring_grafana_external_enabled | bool
  notify: Restart nginx

- name: Enable Grafana nginx reverse proxy
  ansible.builtin.file:
    src: /etc/nginx/sites-available/grafana.conf
    dest: /etc/nginx/sites-enabled/grafana.conf
    state: link
  when: monitoring_grafana_external_enabled | bool
  notify: Restart nginx

- name: Ensure Alertmanager password file exists
  ansible.builtin.copy:
    dest: "{{ monitoring_alertmanager_htpasswd_path }}"
    content: ""
    force: false
    owner: root
    group: www-data
    mode: "0640"
  when: monitoring_alertmanager_external_enabled | bool

- name: Install Alertmanager Basic Auth password file idempotently
  ansible.builtin.shell: |
    if [ "$VPN_AUTH_PRESERVE" = true ] && [ -s {{ monitoring_alertmanager_htpasswd_path }} ]; then
      echo unchanged
    elif printf '%s\n' "$VPN_AUTH_PASSWORD" | htpasswd -viB {{ monitoring_alertmanager_htpasswd_path }} {{ monitoring_alertmanager_basic_auth_user }} >/dev/null 2>&1; then
      echo unchanged
    else
      printf '%s\n' "$VPN_AUTH_PASSWORD" | htpasswd -iB {{ monitoring_alertmanager_htpasswd_path }} {{ monitoring_alertmanager_basic_auth_user }}
      echo changed
    fi
  environment:
    VPN_AUTH_PASSWORD: "{{ monitoring_alertmanager_basic_auth_password }}"
    VPN_AUTH_PRESERVE: "{{ monitoring_preserve_alertmanager_auth | default(true) | bool | ternary('true', 'false') }}"
  register: monitoring_alertmanager_auth_result
  changed_when: "'changed' in monitoring_alertmanager_auth_result.stdout_lines"
  no_log: true
  when: monitoring_alertmanager_external_enabled | bool
  notify: Restart nginx

- name: Configure Alertmanager nginx reverse proxy
  ansible.builtin.template:
    src: nginx-alertmanager.conf.j2
    dest: /etc/nginx/sites-available/alertmanager.conf
    owner: root
    group: root
    mode: "0644"
  when: monitoring_alertmanager_external_enabled | bool
  notify: Restart nginx

- name: Enable Alertmanager nginx reverse proxy
  ansible.builtin.file:
    src: /etc/nginx/sites-available/alertmanager.conf
    dest: /etc/nginx/sites-enabled/alertmanager.conf
    state: link
  when: monitoring_alertmanager_external_enabled | bool
  notify: Restart nginx

- name: Ensure Prometheus password file exists
  ansible.builtin.copy:
    dest: "{{ monitoring_prometheus_htpasswd_path }}"
    content: ""
    force: false
    owner: root
    group: www-data
    mode: "0640"
  when: monitoring_prometheus_external_enabled | bool

- name: Install Prometheus Basic Auth password file idempotently
  ansible.builtin.shell: |
    if [ "$VPN_AUTH_PRESERVE" = true ] && [ -s {{ monitoring_prometheus_htpasswd_path }} ]; then
      echo unchanged
    elif printf '%s\n' "$VPN_AUTH_PASSWORD" | htpasswd -viB {{ monitoring_prometheus_htpasswd_path }} {{ monitoring_prometheus_basic_auth_user }} >/dev/null 2>&1; then
      echo unchanged
    else
      printf '%s\n' "$VPN_AUTH_PASSWORD" | htpasswd -iB {{ monitoring_prometheus_htpasswd_path }} {{ monitoring_prometheus_basic_auth_user }}
      echo changed
    fi
  environment:
    VPN_AUTH_PASSWORD: "{{ monitoring_prometheus_basic_auth_password }}"
    VPN_AUTH_PRESERVE: "{{ monitoring_preserve_prometheus_auth | default(true) | bool | ternary('true', 'false') }}"
  register: monitoring_prometheus_auth_result
  changed_when: "'changed' in monitoring_prometheus_auth_result.stdout_lines"
  no_log: true
  when: monitoring_prometheus_external_enabled | bool
  notify: Restart nginx

- name: Configure Prometheus nginx reverse proxy
  ansible.builtin.template:
    src: nginx-prometheus.conf.j2
    dest: /etc/nginx/sites-available/prometheus.conf
    owner: root
    group: root
    mode: "0644"
  when: monitoring_prometheus_external_enabled | bool
  notify: Restart nginx

- name: Enable Prometheus nginx reverse proxy
  ansible.builtin.file:
    src: /etc/nginx/sites-available/prometheus.conf
    dest: /etc/nginx/sites-enabled/prometheus.conf
    state: link
  when: monitoring_prometheus_external_enabled | bool
  notify: Restart nginx

- name: Disable default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  when: >
    (monitoring_grafana_external_enabled | bool)
    or (monitoring_alertmanager_external_enabled | bool)
    or (monitoring_prometheus_external_enabled | bool)
  notify: Restart nginx

- name: Allow external HTTPS for Grafana
  community.general.ufw:
    rule: allow
    port: "{{ monitoring_grafana_external_port }}"
    proto: tcp
  when: monitoring_grafana_external_enabled | bool

- name: Allow external HTTPS for Alertmanager
  community.general.ufw:
    rule: allow
    port: "{{ monitoring_alertmanager_external_port }}"
    proto: tcp
  when: monitoring_alertmanager_external_enabled | bool

- name: Allow external HTTPS for Prometheus
  community.general.ufw:
    rule: allow
    port: "{{ monitoring_prometheus_external_port }}"
    proto: tcp
  when: monitoring_prometheus_external_enabled | bool

- name: Create Grafana datasource provisioning directory
  ansible.builtin.file:
    path: /etc/grafana/provisioning/datasources
    state: directory
    owner: root
    group: grafana
    mode: "0755"

- name: Create Grafana dashboard provisioning directory
  ansible.builtin.file:
    path: /etc/grafana/provisioning/dashboards
    state: directory
    owner: root
    group: grafana
    mode: "0755"

- name: Create Grafana managed dashboards directory
  ansible.builtin.file:
    path: /var/lib/grafana/dashboards/vpn
    state: directory
    owner: grafana
    group: grafana
    mode: "0755"

- name: Provision Grafana Prometheus datasource
  ansible.builtin.template:
    src: grafana-prometheus-datasource.yml.j2
    dest: /etc/grafana/provisioning/datasources/prometheus.yml
    owner: root
    group: grafana
    mode: "0644"
  notify: Restart grafana

- name: Provision Grafana VPN dashboard provider
  ansible.builtin.template:
    src: grafana-dashboard-provider.yml.j2
    dest: /etc/grafana/provisioning/dashboards/vpn.yml
    owner: root
    group: grafana
    mode: "0644"
  notify: Restart grafana

- name: Install Grafana server overview dashboard
  ansible.builtin.template:
    src: grafana-dashboard-server-overview.json.j2
    dest: /var/lib/grafana/dashboards/vpn/server-overview.json
    owner: grafana
    group: grafana
    mode: "0644"
  notify: Restart grafana

- name: Install Grafana VPN health dashboard
  ansible.builtin.template:
    src: grafana-dashboard-vpn-health.json.j2
    dest: /var/lib/grafana/dashboards/vpn/vpn-health.json
    owner: grafana
    group: grafana
    mode: "0644"
  notify: Restart grafana

- name: Install dedicated Xray dashboard
  ansible.builtin.template:
    src: grafana-dashboard-xray.json.j2
    dest: /var/lib/grafana/dashboards/vpn/xray-connections.json
    owner: grafana
    group: grafana
    mode: "0644"

- name: Enable Prometheus
  ansible.builtin.systemd:
    name: prometheus
    enabled: true
    state: started

- name: Create monitoring settings directory
  ansible.builtin.file:
    path: /var/lib/vpn
    state: directory
    mode: "0700"

- name: Save monitoring settings for repeat phase runs
  ansible.builtin.copy:
    dest: /var/lib/vpn/monitoring-settings.json
    mode: "0600"
    content: "{{ {'monitoring_grafana_admin_password': monitoring_grafana_admin_password, 'monitoring_grafana_basic_auth_password': monitoring_grafana_basic_auth_password, 'monitoring_alertmanager_basic_auth_password': monitoring_alertmanager_basic_auth_password, 'monitoring_alertmanager_telegram_enabled': monitoring_alertmanager_telegram_enabled, 'monitoring_alertmanager_telegram_bot_token': monitoring_alertmanager_telegram_bot_token, 'monitoring_alertmanager_telegram_chat_id': monitoring_alertmanager_telegram_chat_id} | to_nice_json }}\n"
  no_log: true

- name: Enable Alertmanager
  ansible.builtin.systemd:
    name: prometheus-alertmanager
    enabled: true
    state: started

- name: Enable Grafana
  ansible.builtin.systemd:
    name: grafana-server
    enabled: true
    state: started

- name: Enable nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
  when: (monitoring_grafana_external_enabled | bool) or (monitoring_alertmanager_external_enabled | bool)
