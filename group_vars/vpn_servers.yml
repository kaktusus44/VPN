---
awg_interface: awg0
awg_ipv4_network: 10.8.0.0/24
awg_ipv4_address: 10.8.0.1/24
awg_ipv6_network: fd00:8::/64
awg_ipv6_address: fd00:8::1/64
awg_port: 443
vpn_client_count: 100
awg_config_dir: /etc/amnezia/amneziawg
awg_enable_header_protection: true
awg_enable_content_padding: true
awg_enable_timing_obfuscation: true

unbound_ipv4_listen: 10.8.0.1
unbound_ipv6_listen: fd00:8::1

xray_version: "26.3.27"
xray_reality_dest: www.samsung.com:443
xray_reality_server_name: www.samsung.com
xray_xhttp_port: 8443
xray_tcp_port: 8444

export_client_links_path: /var/lib/vpn/client-links.txt
export_amneziawg_configs_path: /var/lib/vpn/amneziawg-client-configs.txt
export_amnezia_vpn_links_path: /var/lib/vpn/amnezia-vpn-links.txt
