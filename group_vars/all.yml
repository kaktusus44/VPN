---
vpn_timezone: Etc/UTC
vpn_admin_user: vpnadmin

vpn_allowed_ssh_sources:
  - 0.0.0.0/0

vpn_enable_ipv6: true
vpn_public_tcp_ports:
  - 22
  - 8443
  - 8444
vpn_public_udp_ports:
  - 443

vpn_forbidden_public_ports:
  - 8877

# Optional Telegram proxies. scripts/deploy-server passes the user's choices.
install_mtproto: false
install_socks5: false
mtproto_port: 9444
socks5_port: 1080
socks5_username: proxyuser
telegram_proxy_links_path: /var/lib/vpn/telegram-proxy-links.txt
